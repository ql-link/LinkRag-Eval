[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkrag-eval"
version = "0.1.0"
description = "Standalone evaluation / quality-check harness for toLink-Rag"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "JiXu" }]

# 生产计算依赖 toLink-Rag(顶层包名 `src`)。本地 `uv sync` 与 CI 使用同一固定 SHA，
# 避免当前 LinkRag 工作区的 API 变化影响独立评测环境。
dependencies = [
    # toLink-Rag 的 torch 依赖要求 setuptools<82;固定上限避免 editable 安装后环境漂移。
    "setuptools<82",
    "qdrant-client>=1.9.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
golden-data = [
    "pyarrow>=17,<24",
]
mysql-migration = [
    "PyMySQL>=1.1.0",
    "cryptography>=42.0.0",
]
ltr = [
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.4,<2",
]
dev = [
    "pip>=26,<27",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "import-linter>=2.0",
    "ruff>=0.4.0",
]

[dependency-groups]
# 项目级 `.venv` 的默认开发环境。保留 `[project.optional-dependencies].dev` 供 CI 的
# `pip install -e '.[dev]'` 使用；这里接入不发布到 PyPI 的固定 LinkRag Git SHA。
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "import-linter>=2.0",
    "ruff>=0.4.0",
    "pyarrow>=17,<24",
    "PyMySQL>=1.1.0",
    "cryptography>=42.0.0",
    "lightgbm>=4.3,<5",
    "scikit-learn>=1.4,<2",
    "pip>=26,<27",
    "tolink-rag",
]

[tool.uv.sources]
tolink-rag = { git = "https://github.com/ql-link/LinkRag.git", rev = "861f24810c3482ec0d86768a24f952b1e08ae675" }

[project.scripts]
linkrag-eval = "linkrag_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkrag_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要本地 SQLite 与真实 Qdrant/embedder 的活栈测试(默认 CI 跳过)",
    "contract: rag 纯函数契约测试(防签名漂移)",
]
