# LinkRag-Eval 本地 SQLite 评测库迁移配置。
# sqlalchemy.url 留空，仅由 alembic/env.py 注入，不作为回退来源：
#   程序化 database_url > ALEMBIC_DATABASE_URL > EVAL_DB_URL（含本地默认值）。
# 所有来源均校验本地 SQLite；sqlite+aiosqlite 转为同步 sqlite driver。
[alembic]
script_location = alembic
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(slug)s
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
